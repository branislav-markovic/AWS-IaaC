AWSTemplateFormatVersion: 2010-09-09
Description: ElastiCache Redis Practise Stack

Parameters:
    VpcId:
        Type: AWS::EC2::VPC::Id
    SubnetA:
        Type: AWS::EC2::Subnet::Id
    SubnetB:
        Type: AWS::EC2::Subnet::Id
    ImageId:
        Type: String
        Default: ami-07b8fb6bd3e9627a6
Resources:
    InstanceSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Security group for EC2
            VpcId: !Ref VpcId
    CacheSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            VpcId: !Ref VpcId
            GroupDescription: Security group for Redis
    CacheSecurityGroupIngress:
        Type: AWS::EC2::SecurityGroupIngress
        Properties:
            GroupId: !Ref CacheSecurityGroup
            IpProtocol: tcp
            FromPort: 6379
            ToPort: 6379
            SourceSecurityGroupId: !Ref InstanceSecurityGroup
    CacheSubnetGroup:
        Type: AWS::ElastiCache::SubnetGroup
        Properties:
            Description: Subnet group for ElastiCache Redis
            SubnetIds:
                - Ref: SubnetA
                - Ref: SubnetB
    CacheCluster:
        Type: AWS::ElastiCache::CacheCluster
        Properties:
            CacheNodeType: 'cache.t3.micro'
            CacheSubnetGroupName: !Ref CacheSubnetGroup
            Engine: redis
            NumCacheNodes: 1
            VpcSecurityGroupIds:
                - !Ref CacheSecurityGroup
    SSMInstanceRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: ec2.amazonaws.com
                      Action: sts:AssumeRole
            ManagedPolicyArns:
                - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
    SSMInstanceProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles:
                - !Ref SSMInstanceRole    
    EC2Instance:
        Type: AWS::EC2::Instance
        Properties:
            IamInstanceProfile: !Ref SSMInstanceProfile
            ImageId: !Ref ImageId
            InstanceType: 't3.micro'
            SubnetId: !Ref SubnetA
            SecurityGroupIds:
                - !Ref InstanceSecurityGroup
            UserData:
                Fn::Base64:
                    !Sub |
                    #!/bin/bash -xe

                    yum update -y
                    
                    # 1. Install redis6 (AL2023 package name)
                    dnf install -y redis6

                    # 2. Create symlink so 'redis-cli' command works
                    ln -s /usr/bin/redis6-cli /usr/bin/redis-cli

                    # 3. Correct variable expansion syntax
                    REDIS_ENDPOINT="${CacheCluster.RedisEndpoint.Address}"
                    REDIS_PORT="${CacheCluster.RedisEndpoint.Port}"

                    # 4. Use standard bash variable syntax (removed the '!')
                    echo "Redis endpoint: $REDIS_ENDPOINT"
                    echo "Redis port: $REDIS_PORT"
Outputs:
    InstanceId:
        Value: !Ref EC2Instance
        Description: EC2 Instance Id
    RedisEndpointAddr:
        Value: !GetAtt 'CacheCluster.RedisEndpoint.Address'
        Description: Redis DNS